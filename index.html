<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário, Kauny! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none; /* Impede selecionar texto no mobile */
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #ffe6e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #d63384;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    /* Botão de abrir/fechar carta */
    .open-btn {
      background-color: #d63384;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-weight: bold;
    }

    /* Envelope */
    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 180px;
      background-color: #f08080;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      cursor: pointer;
      margin-top: 60px;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #e57373;
      transform-origin: top;
      transition: transform 0.5s ease-in-out;
      z-index: 3;
    }

    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 250px;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.6s ease-in-out, opacity 0.5s;
      z-index: 2;
      opacity: 0.8;
      -webkit-user-select: text; /* Permite ler o texto normalmente */
      user-select: text;
    }

    .letter p {
      color: #333;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Classe quando aberto */
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .envelope-wrapper.open .letter {
      transform: translateY(-120px);
      opacity: 1;
      z-index: 4;
    }

    .instruction {
      margin-top: 30px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Uma surpresa para ti ❤️</h1>

  <button class="open-btn" onclick="toggleEnvelope()">💌 Abrir / Fechar Carta</button>

  <div class="envelope-wrapper" id="envelope" onclick="toggleEnvelope()">
    <div class="flap"></div>
    <div class="letter">
      <p><strong>Querida Kauny,</strong></p>
      <br>
      <p>Espero que gostes desta pequena surpresa feita especialmente para ti! ❤️</p>
    </div>
  </div>

  <p class="instruction">Clica no botão ou no envelope para abrir a carta 💌</p>

  <script>
    function toggleEnvelope() {
      var env = document.getElementById('envelope');
      env.classList.toggle('open');
    }
  </script>
</body>
</html>
